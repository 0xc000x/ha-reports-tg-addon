name: ICE Monitor
version: "1.8.0"
slug: stopice_telegram
description: Репорты об ICE из нескольких источников (stopice.net, antifreeze.app, iceout.org, Telegram-каналы) рядом с вами — в Telegram
url: https://github.com/0xc000x/ha-reports-tg-addon
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:map-marker-radius
panel_title: ICE Monitor
hassio_api: true
homeassistant_api: true
map:
  - homeassistant_config:rw
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Карта репортов за сегодня, только просмотр, без входа в Home Assistant (по умолчанию выключено)
options:
  stopice_api_key: ""
  telegram_bot_token: ""
  telegram_chat_id: ""
  locations:
    - name: La Riviera
      latitude: 38.59
      longitude: -121.38
      distance_miles: 20
  antifreeze_enabled: true
  telegram_channels:
    - icetracking
  poll_interval: 60
  notify_on_start: true
schema:
  stopice_api_key: password
  telegram_bot_token: password
  telegram_chat_id: str
  locations:
    - name: str
      latitude: float
      longitude: float
      distance_miles: int(1,200)
  antifreeze_enabled: bool?
  telegram_channels:
    - str
  poll_interval: int(30,3600)
  notify_on_start: bool?
  web_password: password?
  public_page: bool?
  public_base_url: url?
