<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICE Monitor — карта</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --panel: rgba(255, 255, 255, .92); --text: #1c1f24; --muted: #6b7280; --bg: #e5e3df; }
  @media (prefers-color-scheme: dark) {
    :root { --panel: rgba(27, 31, 37, .92); --text: #e8eaed; --muted: #9aa3ad; --bg: #1b1f25; }
    .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.95) contrast(.9); }
  }
  html, body, #map { height: 100%; margin: 0; }
  body { background: var(--bg); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .info {
    background: var(--panel); color: var(--text); padding: 8px 10px; border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .25); max-width: 240px;
  }
  .info b { display: block; margin-bottom: 2px; }
  .info .muted { color: var(--muted); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .me-dot {
    width: 14px; height: 14px; border-radius: 50%; background: #22c55e; border: 2px solid #fff;
    box-shadow: 0 0 0 4px rgba(34, 197, 94, .35), 0 1px 4px rgba(0, 0, 0, .5);
  }
  .locate-btn { font-size: 18px; line-height: 30px !important; text-align: center; text-decoration: none; }
  .rm {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .45);
    color: #fff; font: 700 12px/22px system-ui, sans-serif; text-align: center; cursor: pointer;
  }
  .popup b { display: block; margin-bottom: 4px; }
  .popup hr { border: 0; border-top: 1px solid #e5e7eb; margin: 8px 0; }
  .popup .src { color: #6b7280; font-size: 12px; margin-top: 4px; }
  .popup .desc { margin-top: 6px; max-width: 260px; white-space: pre-line; }
  .popup .muted { color: #6b7280; }
</style>
</head>
<body>
<div id="map"></div>
<script>
const MILE = 1609.344;
// Публичная копия страницы (папка /local Home Assistant) берёт данные из data.json, а не из API add-on'а.
const DATA_FILE = null;
const map = L.map("map").setView([38.59, -121.38], 9);
// Через add-on тайлы идут с его сервера; публичная копия грузит их напрямую с OSM, явно отправляя Referer.
L.tileLayer(DATA_FILE ? "https://tile.openstreetmap.org/{z}/{x}/{y}.png" : "tiles/{z}/{x}/{y}.png", {
  maxZoom: 19, referrerPolicy: "strict-origin-when-cross-origin",
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>',
}).addTo(map);
const zoneLayer = L.featureGroup().addTo(map);
// репорты в отдельном слое поверх зон, чтобы на них можно было нажать
map.createPane("reports").style.zIndex = 650;
const reportLayer = L.layerGroup().addTo(map);

const info = L.control({ position: "topright" });
info.onAdd = () => {
  const div = L.DomUtil.create("div", "info");
  div.innerHTML = '<b id="title">Репорты за сегодня</b>'
    + '<div id="count" class="muted">загрузка…</div>'
    + '<div><span class="dot" style="background:#ef4444"></span>stopice.net</div>'
    + '<div><span class="dot" style="background:#a855f7"></span>iceout / antifreeze</div>'
    + '<div><span class="dot" style="background:#0ea5e9"></span>Telegram</div>';
  return div;
};
info.addTo(map);

async function getJSON(apiPath) {
  const url = DATA_FILE ? `${DATA_FILE}?t=${Date.now()}` : apiPath;
  const resp = await fetch(url, { cache: "no-store" });
  if (!resp.ok) throw new Error(resp.status);
  return resp.json();
}

// Один и тот же случай часто приходит из нескольких источников с теми же координатами:
// такие репорты (до 400 м и 3 часов друг от друга) показываем одной точкой с числом.
function sourceColor(source) {
  if (source === "stopice.net") return "#ef4444";
  if (String(source || "").startsWith("t.me/")) return "#0ea5e9";
  return "#a855f7";
}

function groupReports(list) {
  const groups = [];
  const sorted = (list || []).slice().sort((a, b) => (a.ts || 0) - (b.ts || 0));
  for (const r of sorted) {
    const lat = +r.lat, lon = +r.long;
    if (!isFinite(lat) || !isFinite(lon)) continue;
    const g = groups.find((g) => map.distance([g.lat, g.lon], [lat, lon]) <= 400
      && Math.abs((r.ts || 0) - (g.ts || 0)) <= 3 * 3600);
    if (g) { g.items.push(r); g.ts = r.ts || g.ts; } else groups.push({ lat, lon, ts: r.ts || 0, items: [r] });
  }
  return groups;
}

function reportMarker(group, popup) {
  const newest = group.items[group.items.length - 1];
  const n = group.items.length;
  const icon = L.divIcon({
    className: "",
    html: `<div class="rm" style="background:${sourceColor(newest.source)}">${n > 1 ? n : ""}</div>`,
    iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -12],
  });
  const m = L.marker([group.lat, group.lon], { icon, pane: "reports", bubblingMouseEvents: false });
  m.bindPopup(popup, { maxWidth: 300, maxHeight: 340 });
  return m;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

async function loadZones(fit) {
  const data = await getJSON("api/locations");
  zoneLayer.clearLayers();
  for (const loc of data.locations || []) {
    const c = L.circle([loc.latitude, loc.longitude], {
      radius: loc.distance_miles * MILE, color: "#2563eb", weight: 1.5, fillOpacity: 0.07, interactive: false,
    });
    zoneLayer.addLayer(c);
  }
  if (fit && zoneLayer.getLayers().length) {
    requestAnimationFrame(() => {
      map.invalidateSize();
      map.fitBounds(zoneLayer.getBounds(), { padding: [20, 20], maxZoom: 13 });
    });
  }
}

async function loadReports() {
  try {
    const data = await getJSON("api/reports?today=1");
    reportLayer.clearLayers();
    let n = 0;
    for (const group of groupReports(data.reports)) {
      n += group.items.length;
      const box = el("div", "popup");
      group.items.slice().reverse().forEach((r, i) => {
        if (i) box.append(el("hr"));
        box.append(el("b", "", r.status || ""), el("div", "", r.address || ""), el("div", "muted", r.created || ""));
        if (r.description) box.append(el("div", "desc", r.description));
        const src = el("div", "src", r.source || "");
        if (r.url) {
          const a = el("a", "", "открыть");
          a.href = r.url; a.target = "_blank"; a.rel = "noopener";
          src.append(" · ", a);
        }
        box.append(src);
      });
      reportLayer.addLayer(reportMarker(group, box));
    }
    const today = new Date().toLocaleDateString("ru-RU", { day: "numeric", month: "long", timeZone: "America/Los_Angeles" });
    document.getElementById("title").textContent = `Репорты за ${today}`;
    document.getElementById("count").textContent = n ? `${n} шт. в зонах` : "пока нет";
  } catch (err) {
    document.getElementById("count").textContent = "не удалось загрузить";
  }
}

// --- метка своего устройства: координаты берёт браузер и никуда их не отправляет ---
map.createPane("me").style.zIndex = 640;  // под репортами, чтобы не мешать нажимать на них
let meMarker = null, meAccuracy = null, meLatLng = null, centerOnFix = false;

const locateControl = L.control({ position: "topleft" });
locateControl.onAdd = () => {
  const bar = L.DomUtil.create("div", "leaflet-bar");
  const btn = L.DomUtil.create("a", "locate-btn", bar);
  btn.href = "#"; btn.title = "Где я"; btn.setAttribute("role", "button"); btn.textContent = "◎";
  L.DomEvent.on(btn, "click", (e) => {
    L.DomEvent.stop(e);
    if (meLatLng) map.setView(meLatLng, Math.max(map.getZoom(), 13));
    else { centerOnFix = true; startLocating(); }
  });
  return bar;
};

function startLocating() {
  if (!navigator.geolocation) return;
  map.locate({ watch: true, enableHighAccuracy: true, setView: false });
}

map.on("locationfound", (e) => {
  meLatLng = e.latlng;
  if (!meMarker) {
    meAccuracy = L.circle(e.latlng, { radius: e.accuracy, pane: "me", interactive: false,
      color: "#22c55e", weight: 1, fillColor: "#22c55e", fillOpacity: 0.12 }).addTo(map);
    meMarker = L.marker(e.latlng, { pane: "me", interactive: false, keyboard: false,
      icon: L.divIcon({ className: "", html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }) }).addTo(map);
  } else {
    meMarker.setLatLng(e.latlng);
    meAccuracy.setLatLng(e.latlng).setRadius(e.accuracy);
  }
  const btn = document.querySelector(".locate-btn");
  if (btn) { btn.title = "Где я"; btn.style.opacity = ""; }
  if (centerOnFix) { centerOnFix = false; map.setView(e.latlng, Math.max(map.getZoom(), 13)); }
});

map.on("locationerror", () => {
  // нет разрешения: метку не показываем, кнопка остаётся для повторной попытки
  centerOnFix = false;
  const btn = document.querySelector(".locate-btn");
  if (btn && !meLatLng) {
    btn.title = "Нет доступа к геопозиции — разрешите её для этого сайта и нажмите снова";
    btn.style.opacity = "0.5";
  }
});

if (window.isSecureContext && navigator.geolocation) {
  locateControl.addTo(map);
  startLocating();
}

window.addEventListener("resize", () => map.invalidateSize());
loadZones(true).catch(() => {});
loadReports();
setInterval(loadReports, 60000);
setInterval(() => loadZones(false).catch(() => {}), 10 * 60000);
</script>
</body>
</html>
